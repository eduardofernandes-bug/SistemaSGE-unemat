<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>SGE - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --bg: #f5f6fa;
      --bg-card: #ffffff;
      --text: #1f2937;
      --text-light: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    body.dark {
      --bg: #0b1220;
      --bg-card: #0f1724;
      --text: #e6eef8;
      --text-light: #94a3b8;
      --border: #1f2a3a;
      --primary: #8b93ff;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      padding: 1rem;
    }

    .login-card {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: all 0.3s ease;
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-section {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo-icon {
      width: 70px;
      height: 70px;
      background: var(--gradient);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      font-size: 2rem;
      color: white;
      box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
    }

    .logo-title {
      font-size: 1.75rem;
      font-weight: 800;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .logo-subtitle {
      color: var(--text-light);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: block;
      color: var(--text);
      font-size: 0.9rem;
    }

    .form-control-login {
      width: 100%;
      padding: 0.85rem 1rem;
      padding-left: 3rem;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      background: var(--bg-card);
      color: var(--text);
    }

    .form-control-login:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }

    .input-group {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      font-size: 1.1rem;
      z-index: 10;
    }

    .btn-login {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 10px;
      background: var(--gradient);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 1rem;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .theme-toggle {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 10px;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1.2rem;
      color: var(--text);
    }

    .theme-toggle:hover {
      transform: scale(1.05);
      border-color: var(--primary);
    }

    .alert-custom {
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.9rem;
    }

    .alert-danger {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #dc2626;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #059669;
    }

    .alert-warning {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #d97706;
    }

    .alert-info {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #2563eb;
    }

    .forgot-password {
      text-align: center;
      margin-top: 1.5rem;
    }

    .forgot-password a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }

    .divider {
      text-align: center;
      margin: 2rem 0;
      position: relative;
    }

    .divider::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      background: var(--bg-card);
      padding: 0 1rem;
      position: relative;
      color: var(--text-light);
      font-size: 0.85rem;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 2rem 1.5rem;
      }

      .logo-title {
        font-size: 1.5rem;
      }

      .theme-toggle {
        top: 1rem;
        right: 1rem;
      }
    }

    .btn-login.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    .btn-login.loading::after {
      content: '';
      width: 16px;
      height: 16px;
      border: 2px solid white;
      border-top-color: transparent;
      border-radius: 50%;
      display: inline-block;
      margin-left: 0.5rem;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    body.dark .alert-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }

    body.dark .alert-success {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }

    body.dark .alert-warning {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
    }

    body.dark .alert-info {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
    }

  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" title="Alternar tema">
    <i id="themeIcon" class="bi bi-moon-fill"></i>
  </button>

  <div class="login-container">
    <div class="login-card">
      <div class="logo-section">
        <div class="logo-icon">
          <i class="bi bi-briefcase"></i>
        </div>
        <h1 class="logo-title">SGE</h1>
        <p class="logo-subtitle">Sistema de Gerenciamento de Estágios</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert-custom alert-{{ category }}">
              <i class="bi bi-{% if category == 'danger' %}exclamation-circle-fill{% elif category == 'success' %}check-circle-fill{% elif category == 'warning' %}exclamation-triangle-fill{% else %}info-circle-fill{% endif %}"></i>
              <span>{{ message }}</span>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('login') }}" id="loginForm">
        <div class="form-group">
          <label class="form-label">Email</label>
          <div class="input-group">
            <i class="input-icon bi bi-envelope-fill"></i>
            <input 
              type="email" 
              name="email" 
              class="form-control-login" 
              placeholder="seu@email.com"
              required
              autofocus
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Senha</label>
          <div class="input-group">
            <i class="input-icon bi bi-lock-fill"></i>
            <input 
              type="password" 
              name="senha" 
              class="form-control-login" 
              placeholder="••••••••"
              required
            >
          </div>
        </div>

        <button type="submit" class="btn-login" id="btnLogin">
          <i class="bi bi-box-arrow-in-right"></i>
          Entrar
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; color: var(--text-light); font-size: 0.85rem;">
        <p style="margin: 0;">Acesso restrito a usuários autorizados</p>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const toggle = document.getElementById('themeToggle');
      const icon = document.getElementById('themeIcon');
      const body = document.body;

      const saved = localStorage.getItem('theme');
      if (saved === 'dark') {
        body.classList.add('dark');
        icon.className = 'bi bi-sun-fill';
      }

      toggle.addEventListener('click', function(){
        body.classList.toggle('dark');
        const isDark = body.classList.contains('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        icon.className = isDark ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
      });
    })();

    document.getElementById('loginForm').addEventListener('submit', function(e){
      const btn = document.getElementById('btnLogin');
      btn.classList.add('loading');
      btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Entrando...';
    });

    setTimeout(function(){
      const alerts = document.querySelectorAll('.alert-custom');
      alerts.forEach(function(alert){
        alert.style.transition = 'opacity 0.3s ease';
        alert.style.opacity = '0';
        setTimeout(function(){ alert.remove(); }, 300);
      });
    }, 5000);
  </script>
</body>
</html>
